<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swap Calculator</title>
<style>
  :root{
    color-scheme:light;
    --bg:#ffffff;--panel:#ffffff;--panel-2:#f6f7f9;--line:#e3e6ea;
    --gold:#9a7b12;--gold-soft:#c9ac4a;--text:#1a1d21;--text-dim:#6b7280;
    --green:#15803d;--red:#c62828;
    --mono:"SFMono-Regular","Roboto Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,"Inter","Segoe UI",sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);padding:28px 18px 60px;}
  .wrap{max-width:960px;margin:0 auto;}
  .hero{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .hero-title{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;}
  .hero-sub{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.01em;}
  .hero-tag{font-family:var(--mono);font-size:12px;color:var(--text-dim);text-align:right;line-height:1.6;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  @media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr);}}
  .field{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;}
  .field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-dim);margin-bottom:8px;}
  .field input,.field select{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--mono);font-size:17px;outline:none;padding:0;}
  .field input:focus,.field select:focus{color:var(--gold);}
  .field select option{background:var(--panel-2);color:var(--text);}
  .field.mode{border-color:var(--gold-soft);}
  .toggle-row{display:flex;align-items:center;gap:10px;}
  .toggle-field select{flex:1;}
  .toggle-caption{font-family:var(--mono);font-size:10.5px;color:var(--gold);margin-top:8px;}
  .toggle-caption.off{color:var(--text-dim);}
  .switch{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0;margin:0!important;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--line);border-radius:21px;transition:.2s;}
  .switch .slider::before{content:"";position:absolute;height:15px;width:15px;left:3px;bottom:3px;background:var(--text-dim);border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:rgba(154,123,18,.3);}
  .switch input:checked + .slider::before{transform:translateX(17px);background:var(--gold);}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  @media(max-width:720px){.summary{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--panel-2);border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:4px;padding:14px;}
  .stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-dim);margin-bottom:6px;}
  .stat .v{font-family:var(--mono);font-size:20px;font-weight:600;}
  .stat .v.neg{color:var(--red);}.stat .v.pos{color:var(--green);}.stat .v.au{color:var(--gold);}
  .decay{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:22px;}
  .decay-fill{height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));transition:width .3s ease;}
  .decay-caption{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:6px;margin-bottom:22px;}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  thead th{text-align:left;font-family:var(--sans);text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:var(--text-dim);background:var(--panel-2);padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;}
  tbody td{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--text);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.wed{background:rgba(154,123,18,.08);}
  tbody tr.wed td:first-child{color:var(--gold);}
  tbody tr.weekend{opacity:.45;}
  .tag-wed,.tag-off{display:inline-block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:1px 5px;margin-left:6px;}
  .tag-wed{color:var(--bg);background:var(--gold);}
  .tag-off{color:var(--text-dim);background:var(--line);}
  .scroll{max-height:520px;overflow:auto;border-radius:6px;}
  .scroll::-webkit-scrollbar{width:8px;}
  .scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .foot-note{font-size:11.5px;color:var(--text-dim);margin-top:14px;line-height:1.6;}
  .foot-note b{color:var(--text);}
  .share{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;}
  .share-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .share-head span{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-dim);}
  .btn{background:var(--gold);color:#fff;border:none;border-radius:5px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn:hover{opacity:.9;}
  #summaryText{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:12.5px;line-height:1.6;padding:12px;resize:vertical;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div>
      <div class="hero-title"><span id="dirTitle">Long</span> Position</div>
      <div class="hero-sub">Swap Calculator</div>
    </div>
    <div class="hero-tag" id="todayTag"></div>
  </div>

  <div class="grid">
    <div class="field mode">
      <label>Swap calculation mode</label>
      <select id="swapMode">
        <option value="points">Points</option>
        <option value="percent">Percentage (% p.a.)</option>
      </select>
    </div>
    <div class="field">
      <label>Lots</label>
      <input id="lots" type="number" min="0.01" step="0.01" value="1">
    </div>

    <!-- Points mode inputs -->
    <div class="field pt">
      <label>Swap / lot / day ($)</label>
      <input id="swapRate" type="number" step="0.01" value="55">
    </div>
    <div class="field pt">
      <label>Lot size ($)</label>
      <input id="lotSize" type="number" step="1" value="100">
    </div>

    <!-- Percentage mode inputs -->
    <div class="field pc">
      <label>Swap rate (% per year)</label>
      <input id="pctRate" type="number" step="0.01" value="5">
    </div>
    <div class="field pc">
      <label>Contract size (oz / lot)</label>
      <input id="contractSize" type="number" step="1" value="100">
    </div>
    <div class="field pc">
      <label>Market price ($ / oz)</label>
      <input id="marketPrice" type="number" step="0.01" value="2650">
    </div>
    <div class="field pc">
      <label>Day basis</label>
      <input id="dayBasis" type="number" step="1" min="1" value="360">
    </div>

    <div class="field">
      <label>Contract start date</label>
      <input id="startDate" type="date">
    </div>
    <div class="field">
      <label>Contract close date</label>
      <input id="closeDate" type="date">
    </div>
    <div class="field">
      <label>Contract length (days)</label>
      <input id="totalDays" type="number" min="1" step="1" value="90">
    </div>
    <div class="field">
      <label>Direction</label>
      <select id="direction">
        <option value="long">Long</option>
        <option value="short">Short</option>
      </select>
    </div>
    <div class="field toggle-field">
      <label>Triple-swap day</label>
      <div class="toggle-row">
        <select id="tripleDay">
          <option value="3">Wednesday</option>
          <option value="5">Friday</option>
          <option value="1">Monday</option>
        </select>
        <label class="switch">
          <input type="checkbox" id="tripleEnabled" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-caption" id="tripleCaption">3x swap applied</div>
    </div>
    <div class="field">
      <label>View as of day</label>
      <input id="asOfDay" type="number" min="1" value="1">
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="decay"><div class="decay-fill" id="decayFill"></div></div>
  <div class="decay-caption">
    <span id="decayLeft">Day 1 of 90</span>
    <span id="decayRight">89 days remaining</span>
  </div>
  <div class="foot-note pt" id="unitNote" style="margin-top:-14px;margin-bottom:14px;">
    Table's Daily Swap / Cumulative columns are shown per-lot-unit (&times;lot size) &mdash; the summary cards above show the actual scaled swap fee.
  </div>

  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th>Day</th><th>Date</th><th>Weekday</th><th>Days left</th><th>Swap nights</th><th>Daily swap</th><th>Cumulative</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="share">
    <div class="share-head">
      <span>Client summary</span>
      <button class="btn" id="copyBtn" type="button">Copy summary</button>
    </div>
    <textarea id="summaryText" rows="17" readonly></textarea>
  </div>

  <div class="foot-note" id="logicNote"></div>

</div>

<script>
const $ = id => document.getElementById(id);

function fmtMoney(n){
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function todayISO(){
  const d = new Date();
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function addDays(dateStr, days){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function daysBetween(a, b){
  return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00")) / 86400000);
}

const today = todayISO();
$("startDate").value = today;
$("closeDate").value = addDays(today, 90);
$("todayTag").textContent = "GENERATED " + new Date().toDateString().toUpperCase();

const WEEKDAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

let lastCalc = null;
function fmtD(s){
  return new Date(s+"T00:00:00").toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"});
}
function buildSummary(){
  const c = lastCalc; if(!c) return;
  const m = fmtMoney;
  const L = [];
  L.push("SWAP SUMMARY");
  L.push("------------------------------");
  L.push(`Position: ${c.direction==="long"?"Long (Buy)":"Short (Sell)"}, ${c.lots} lot(s)`);
  L.push(`Period: ${fmtD(c.start)} to ${fmtD(c.close)} (${c.totalDays} days)`);
  L.push(`Swap nights charged: ${c.totalNights} (Sat/Sun not charged${c.tripleEnabled?"; "+c.tripleName+" = 3 nights":""})`);
  L.push("");
  L.push("HOW IT IS CALCULATED");
  if(c.mode==="points"){
    L.push(`Swap rate: $${c.rate} per lot per day`);
    L.push(`Lot size: ${c.lotSize}`);
    L.push(`Swap per night = ($${c.rate} x ${c.lots} lot) / ${c.lotSize} = ${m(c.perNight)}`);
  } else {
    L.push(`Contract size: ${c.contractSize} | Market price: ${m(c.price)} | Swap rate: ${c.pctRate}% p.a. | Day basis: ${c.dayBasis}`);
    L.push(`Swap per night = ${c.contractSize} x ${c.lots} x ${m(c.price)} x ${c.pctRate} / (100 x ${c.dayBasis}) = ${m(c.perNight)}`);
  }
  L.push(`Total swap = ${m(c.perNight)} x ${c.totalNights} nights = ${m(c.totalSwap)}`);
  L.push("");
  L.push("RESULT");
  L.push(`Swap as of Day ${c.asOfDay}: ${m(c.cumAtAsOf)}`);
  L.push(`Total swap (${c.totalDays} days): ${m(c.totalSwap)}`);
  L.push(`Average per calendar day: ${m(c.avgDaily)}`);
  L.push(`Position notional: ${m(c.notional)}`);
  $("summaryText").value = L.join("\n");
}
$("copyBtn").addEventListener("click", async () => {
  const ta = $("summaryText"), btn = $("copyBtn");
  let ok = false;
  try { await navigator.clipboard.writeText(ta.value); ok = true; } catch(e){}
  if(!ok){ try { ta.select(); ok = document.execCommand("copy"); } catch(e){} }
  btn.textContent = ok ? "Copied \u2713" : "Select text & copy";
  setTimeout(() => btn.textContent = "Copy summary", 1800);
});

let lastEdited = "totalDays";
$("startDate").addEventListener("input", () => { lastEdited = "startDate"; syncDates(); });
$("closeDate").addEventListener("input", () => { lastEdited = "closeDate"; syncDates(); });
$("totalDays").addEventListener("input", () => { lastEdited = "totalDays"; syncDates(); });

function syncDates(){
  const start = $("startDate").value, close = $("closeDate").value;
  const days = parseInt($("totalDays").value) || 0;
  if(lastEdited === "closeDate" && start && close){
    $("totalDays").value = Math.max(1, daysBetween(start, close));
  } else if(lastEdited === "totalDays" && start && days > 0){
    $("closeDate").value = addDays(start, days);
  } else if(lastEdited === "startDate" && close){
    $("totalDays").value = Math.max(1, daysBetween(start, close));
  }
}

function render(){
  const mode = $("swapMode").value; // "points" | "percent"
  const isPoints = mode === "points";
  document.querySelectorAll(".pt").forEach(e => e.style.display = isPoints ? "" : "none");
  document.querySelectorAll(".pc").forEach(e => e.style.display = isPoints ? "none" : "");

  const lots = parseFloat($("lots").value) || 0;
  const rate = parseFloat($("swapRate").value) || 0;
  const lotSize = parseFloat($("lotSize").value) || 0;
  const pctRate = parseFloat($("pctRate").value) || 0;
  const contractSize = parseFloat($("contractSize").value) || 0;
  const price = parseFloat($("marketPrice").value) || 0;
  const dayBasis = parseFloat($("dayBasis").value) || 360;
  const totalDays = Math.max(1, parseInt($("totalDays").value) || 1);
  const tripleDow = parseInt($("tripleDay").value);
  const tripleEnabled = $("tripleEnabled").checked;
  const direction = $("direction").value;
  const start = new Date($("startDate").value + "T00:00:00");
  let asOfDay = Math.min(Math.max(1, parseInt($("asOfDay").value) || 1), totalDays);
  $("asOfDay").max = totalDays;
  $("asOfDay").value = asOfDay;
  $("dirTitle").textContent = direction === "long" ? "Long" : "Short";

  $("tripleDay").disabled = !tripleEnabled;
  const capEl = $("tripleCaption");
  capEl.textContent = tripleEnabled
    ? `3x swap applied on ${$("tripleDay").options[$("tripleDay").selectedIndex].text}`
    : "3x swap off — every day charges 1x";
  capEl.classList.toggle("off", !tripleEnabled);

  const dirSign = direction === "long" ? 1 : -1;
  const perLotPerNight = rate * dirSign;
  const lotDivisor = lotSize || 1;
  // Percentage formula (per night):
  // Contract Size x Lot Size x Market Price x Swap Rate x Days / (100 x Day Basis)
  const pctPerNight = dirSign * contractSize * lots * price * pctRate / (100 * dayBasis);
  const displayMult = isPoints ? lotDivisor : 1;

  let cumulative = 0, cumAtAsOf = 0;
  const rows = [];

  for(let day=1; day<=totalDays; day++){
    const date = new Date(start.getTime());
    date.setDate(date.getDate() + (day-1));
    const dow = date.getDay();
    const isWeekend = (dow === 0 || dow === 6);
    const nights = isWeekend ? 0 : ((tripleEnabled && dow === tripleDow) ? 3 : 1);
    const dailySwap = isPoints
      ? (perLotPerNight * lots * nights) / lotDivisor
      : pctPerNight * nights;
    cumulative += dailySwap;
    rows.push({day, date, dow, nights, dailySwap, cumulative, daysLeft: totalDays - day, isWeekend});
    if(day === asOfDay) cumAtAsOf = cumulative;
  }

  const totalSwap = cumulative;
  const asOfRow = rows[asOfDay-1];
  const avgDaily = totalSwap / totalDays;
  const notional = isPoints ? lots * lotSize : contractSize * lots * price;

  $("summary").innerHTML = `
    <div class="stat"><div class="k">Swap as of Day ${asOfDay}</div>
      <div class="v ${cumAtAsOf<0?'neg':'pos'}">${fmtMoney(cumAtAsOf)}</div></div>
    <div class="stat"><div class="k">Total swap (full ${totalDays}d)</div>
      <div class="v au">${fmtMoney(totalSwap)}</div></div>
    <div class="stat"><div class="k">Avg swap / calendar day</div>
      <div class="v ${avgDaily<0?'neg':'pos'}">${fmtMoney(avgDaily)}</div></div>
    <div class="stat"><div class="k">Position notional</div>
      <div class="v">${fmtMoney(notional)}</div></div>
  `;

  $("decayFill").style.width = ((asOfDay-1)/totalDays)*100 + "%";

  lastCalc = {
    mode, direction, lots, rate, lotSize, pctRate, contractSize, price, dayBasis,
    totalDays, start: $("startDate").value, close: $("closeDate").value,
    tripleEnabled, tripleName: $("tripleDay").options[$("tripleDay").selectedIndex].text,
    totalNights: rows.reduce((s,r) => s + r.nights, 0),
    perNight: isPoints ? (perLotPerNight * lots) / lotDivisor : pctPerNight,
    asOfDay, cumAtAsOf, totalSwap, avgDaily, notional
  };
  buildSummary();
  $("decayLeft").textContent = `Day ${asOfDay} of ${totalDays}`;
  $("decayRight").textContent = `${asOfRow.daysLeft} days remaining`;

  $("tbody").innerHTML = rows.map(r => `
    <tr class="${tripleEnabled && r.dow===tripleDow?'wed':''} ${r.isWeekend?'weekend':''}">
      <td>${r.day}${r.day===asOfDay ? ' <span class="tag-wed" style="background:var(--text-dim);color:var(--bg);">NOW</span>' : ''}</td>
      <td>${r.date.toLocaleDateString(undefined,{month:'short',day:'2-digit',year:'numeric'})}</td>
      <td>${WEEKDAYS[r.dow]}${tripleEnabled && r.dow===tripleDow ? '<span class="tag-wed">3x</span>' : ''}${r.isWeekend ? '<span class="tag-off">off</span>' : ''}</td>
      <td>${r.daysLeft}</td>
      <td>${r.nights}</td>
      <td style="color:${r.isWeekend ? 'var(--text-dim)' : (r.dailySwap<0?'var(--red)':'var(--green)')}">${fmtMoney(r.dailySwap * displayMult)}</td>
      <td>${fmtMoney(r.cumulative * displayMult)}</td>
    </tr>
  `).join("");

  const common = `Saturday and Sunday carry no swap charge — the weekend cost is rolled into the triple-swap weekday instead. Weekday rows charge 1 night each; the selected triple-swap day charges 3 nights when turned on. Short positions invert the sign. Start date, close date, and contract length stay in sync.`;
  $("logicNote").innerHTML = isPoints
    ? `<b>Logic (Points):</b> daily swap $ = (swap/lot/day × lots × nights) ÷ lot size. ${common}`
    : `<b>Logic (Percentage):</b> swap $ = Contract Size × Lot Size × Market Price × Swap Rate × Days ÷ (100 × Day Basis), where Lot Size = number of lots and Days = swap nights for that row. Swap rate is the annual %. ${common}`;
}

["swapMode","lots","swapRate","lotSize","pctRate","contractSize","marketPrice","dayBasis","totalDays","startDate","closeDate","tripleDay","tripleEnabled","direction","asOfDay"]
  .forEach(id => $(id).addEventListener("input", render));

syncDates();
render();
</script>
</body>
</html>
